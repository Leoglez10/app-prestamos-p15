name: "🐞 Reportar un problema"
description: Algo no funcionó como debería, o la app hizo algo raro.
title: "[Problema]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        **No hace falta saber de computadoras.** Llena lo que puedas y listo.

        💡 **Si puedes abrir la app, usa el botón de adentro:** ve a
        **Admin → Configuración → Escribir un reporte…**. Ese camino manda solo la versión
        y el sistema operativo, y llega al mismo lugar con menos pasos.

        Usa este formulario si prefieres escribirlo desde el navegador, o si la app no abre.

        📸 Si puedes, adjunta una captura de pantalla. Es lo que más ayuda.

  - type: dropdown
    id: area
    attributes:
      label: "¿En qué parte de la app pasó?"
      description: Si no estás seguro, elige la última opción.
      options:
        - Kiosko (préstamo de equipos a profesores)
        - Admin (panel de administración)
        - Inventario o equipos
        - Préstamo rápido (alumnos)
        - Respaldos o restauración
        - Importar Excel de Patrimonio
        - Reportes o PDF
        - Actualizaciones de la app
        - No estoy seguro
    validations:
      required: true

  - type: textarea
    id: que-intentaba
    attributes:
      label: "¿Qué estabas intentando hacer?"
      description: "Ejemplo: prestar una laptop desde el kiosko / importar el Excel de Patrimonio."
      placeholder: "Yo estaba tratando de..."
    validations:
      required: true

  - type: textarea
    id: que-ocurrio
    attributes:
      label: "¿Qué ocurrió?"
      description: Cuéntalo con tus palabras. Si apareció un mensaje de error, cópialo tal cual.
      placeholder: "Lo que pasó fue..."
    validations:
      required: true

  - type: textarea
    id: que-debia-ocurrir
    attributes:
      label: "¿Qué esperabas que ocurriera?"
      description: Opcional, pero ayuda a entender la diferencia.
      placeholder: "Yo esperaba que..."
    validations:
      required: false

  - type: dropdown
    id: frecuencia
    attributes:
      label: "¿Vuelve a pasar?"
      options:
        - Pasa siempre, cada vez que lo intento
        - Pasa a veces
        - Pasó una sola vez
        - No lo he vuelto a intentar
    validations:
      required: true

  - type: dropdown
    id: sistema
    attributes:
      label: "¿En qué computadora ocurrió?"
      options:
        - Windows 10
        - Windows 11
        - Otra / no sé
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: "Versión de la app (opcional)"
      description: "Por ejemplo 0.11.1. La ves en Admin → Configuración → Actualizaciones, o en el nombre del instalador."
      placeholder: "0.11.1"
    validations:
      required: false

  - type: textarea
    id: captura
    attributes:
      label: "Captura de pantalla (opcional, pero ayuda mucho)"
      description: Arrastra la imagen a este cuadro, o usa el enlace "Adjuntar archivos" que está debajo.
    validations:
      required: false
