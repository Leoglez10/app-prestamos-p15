name: "💡 Sugerir una mejora"
description: ¿Qué te gustaría que hiciera la aplicación?
title: "[Mejora]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Cualquier persona puede proponer mejoras: profesores, administrativos, becarios.
        No hace falta saber programar.

        Cuéntalo como si se lo explicaras a un compañero de la oficina: qué haces hoy,
        qué te gustaría que pasara y por qué te ahorraría trabajo.

  - type: dropdown
    id: area
    attributes:
      label: "¿A qué parte de la app se refiere?"
      options:
        - Kiosko (préstamo de equipos a profesores)
        - Admin (panel de administración)
        - Inventario o equipos
        - Préstamo rápido (alumnos)
        - Respaldos o restauración
        - Importar Excel de Patrimonio
        - Reportes o PDF
        - Actualizaciones de la app
        - Es algo nuevo, todavía no existe
    validations:
      required: true

  - type: textarea
    id: que-gustaria
    attributes:
      label: "¿Qué te gustaría que hiciera la aplicación?"
      placeholder: "Me gustaría que la app..."
    validations:
      required: true

  - type: textarea
    id: como-lo-haces-hoy
    attributes:
      label: "¿Cómo lo resuelves hoy?"
      description: Si hoy lo haces a mano o de otra forma, cuéntalo. Ayuda a entender el punto de partida.
      placeholder: "Hoy lo hago..."
    validations:
      required: false

  - type: textarea
    id: por-que-util
    attributes:
      label: "¿Por qué sería útil?"
      description: "¿Qué problema te ahorra? ¿Quién más se beneficiaría (profesores, alumnos, audiovisuales)?"
      placeholder: "Sería útil porque..."
    validations:
      required: true

  - type: dropdown
    id: rol
    attributes:
      label: "¿Cómo usas la app?"
      options:
        - Profesor (kiosko)
        - Administrador / audiovisuales
        - Préstamo rápido (alumnos)
        - Programador / mantenimiento
        - Otra
    validations:
      required: true
