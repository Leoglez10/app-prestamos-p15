name: Build Windows Installer

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-latest]

    runs-on: ${{ matrix.platform }}
    steps:
      # Full history and tags: the release notes come from the commits between
      # the previous tag and this one, and the default shallow clone has neither.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Check updater signing configuration
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY) -or
              [string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY_PASSWORD)) {
            throw "Configure both updater signing secrets before building a release."
          }

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: install dependencies
        working-directory: ./app-prestamos-p15
        run: npm ci

      - name: Install Bun
        run: npm install -g bun

      - name: Test frontend (includes lint)
        working-directory: ./app-prestamos-p15
        run: npm test

      - name: Test Rust
        working-directory: ./app-prestamos-p15
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml

      # The app shows this text as "Notas de la versión", so it has to read like a
      # sentence to the staff, not like a commit log.
      - name: Generate release notes
        id: notes
        shell: pwsh
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          # git speaks UTF-8; without this the accents of the Spanish subjects
          # come back mangled through the console codepage.
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
          $fallback = "Esta versión trae mejoras internas y correcciones menores."
          $features = @()
          $fixes = @()
          if ($env:REF_TYPE -eq "tag") {
            $tag = $env:REF_NAME
            $previous = git describe --tags --abbrev=0 "$tag^" 2>$null
            if ($LASTEXITCODE -eq 0 -and -not [string]::IsNullOrWhiteSpace($previous)) {
              foreach ($subject in @(git log --no-merges --format=%s "$previous..$tag")) {
                if ($subject -match '^(?<type>feat|fix)(\([^)]*\))?!?:\s*(?<text>.+)$') {
                  $text = $Matches['text'].Trim()
                  if ($text.Length -gt 0) {
                    $text = $text.Substring(0, 1).ToUpper() + $text.Substring(1)
                    if ($Matches['type'] -eq 'feat') { $features += "- $text" } else { $fixes += "- $text" }
                  }
                }
              }
            } else {
              Write-Host "No previous tag found for $tag; using the generic release body."
            }
          }
          $sections = @()
          if ($features.Count -gt 0) { $sections += (@("Novedades") + $features) -join "`n" }
          if ($fixes.Count -gt 0) { $sections += (@("Correcciones") + $fixes) -join "`n" }
          $body = if ($sections.Count -gt 0) { $sections -join "`n`n" } else { $fallback }
          Write-Host $body
          "body<<RELEASE_BODY_EOF" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          $body | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "RELEASE_BODY_EOF" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      # tauri's beforeBuildCommand runs the TypeScript check and Vite production build.
      - name: build tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: ./app-prestamos-p15
          tagName: v__VERSION__
          releaseName: "App Prestamos P15 v__VERSION__"
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          updaterJsonPreferNsis: true
          args: --target x86_64-pc-windows-msvc

  build-manual:
    name: Build and attach staff manual
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-tauri
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: setup python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ./app-prestamos-p15/docs/manual-pdf-requirements.txt

      - name: install dependencies
        working-directory: ./app-prestamos-p15
        run: python -m pip install --requirement docs/manual-pdf-requirements.txt

      - name: build staff manual PDF
        working-directory: ./app-prestamos-p15
        env:
          MANUAL_VERSION: ${{ github.ref_name }}
        run: python scripts/build-manual-pdf.py

      - name: attach staff manual to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release upload "${GITHUB_REF_NAME}"
          ./app-prestamos-p15/output/pdf/manual-personal-app-prestamos-p15.pdf
          --clobber
