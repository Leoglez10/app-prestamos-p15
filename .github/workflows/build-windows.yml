name: Build Windows Installer

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-latest]

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: install dependencies
        working-directory: ./app-prestamos-p15
        run: npm ci

      - name: Install Bun
        run: npm install -g bun

      - name: build tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: ./app-prestamos-p15
          tagName: v__VERSION__
          releaseName: "App Prestamos P15 v__VERSION__"
          releaseBody: "Automated build of the application."
          releaseDraft: false
          prerelease: false
          args: --target x86_64-pc-windows-msvc

  build-manual:
    name: Build and attach staff manual
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-tauri
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: setup python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ./app-prestamos-p15/docs/manual-pdf-requirements.txt

      - name: install dependencies
        working-directory: ./app-prestamos-p15
        run: python -m pip install --requirement docs/manual-pdf-requirements.txt

      - name: build staff manual PDF
        working-directory: ./app-prestamos-p15
        env:
          MANUAL_VERSION: ${{ github.ref_name }}
        run: python scripts/build-manual-pdf.py

      - name: attach staff manual to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release upload "${GITHUB_REF_NAME}"
          ./app-prestamos-p15/output/pdf/manual-personal-app-prestamos-p15.pdf
          --clobber
