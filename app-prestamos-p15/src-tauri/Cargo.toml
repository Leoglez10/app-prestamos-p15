[package]
name = "app-prestamos-p15"
version = "0.6.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "app_prestamos_p15_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"

# Servidor HTTP para el acceso desde celular (ver docs/QR_CELULAR.md).
# tiny_http en lugar de axum: unas pocas rutas en una LAN no justifican el peso de axum.
tiny_http = { version = "0.12", features = ["ssl-rustls"] }
# CA propia + certificado por IP, para que el celular tenga contexto seguro y
# pueda abrir la camara. Ver docs/QR_CELULAR.md.
rcgen = "0.14"
# Mismo driver que ya usa tauri-plugin-sql, para no meter un segundo SQLite al binario.
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite"] }
sha2 = "0.10"
hex = "0.4"
getrandom = "0.3"
# Lectura del Excel de Patrimonio. Es la unica forma seria de leer .xlsx desde
# Rust; el resto del importador (validar e insertar) vive en TypeScript.
# Ver docs/PLAN_IMPORTACION_PATRIMONIO.md §6 P3.
calamine = "0.36.1"

