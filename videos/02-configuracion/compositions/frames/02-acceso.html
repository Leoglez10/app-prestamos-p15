          t: 1, duration: dur, ease: "none",
          onUpdate: () => {
            const n = Math.min(text.length, Math.floor(d.t * (text.length + 0.4)));

        const b = { p: 0 };
        tl.to(b, {
          p: Math.PI * 2 * Math.max(2, Math.round(dur * 1.6)), duration: dur, ease: "none",
          onUpdate: () => { gsap.set(sel, { opacity: Math.sin(b.p) > 0 ? 1 : 0.15 }); },

      };

      blink("#a2-c1", 2.24, 1.4);
      tl.to("#a2-c1", { opacity: 0, duration: 0.01 }, 3.7);

      tl.to("#a2-ph2", { opacity: 0, duration: 0.2, ease: "power2.in" }, 3.74);

      const tabs = ["#a2-t1", "#a2-t2", "#a2-t3", "#a2-t4", "#a2-t5", "#a2-t6"];

      /* "solo necesitas tres" — the three that matter come forward, the rest recede. */
