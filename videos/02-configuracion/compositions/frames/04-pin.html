  <script>
    (function () {
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      const link = document.getElementById("n4-link-path");
      const lLen = link && link.getTotalLength ? link.getTotalLength() : 320;
      gsap.set(link, { strokeDasharray: "14 12", strokeDashoffset: lLen });

      const press = (target, at) => {
        tl.to("#n4-cursor", { scale: 0.85, duration: 0.09, ease: "power1.in" }, at);
        tl.to("#n4-cursor", { scale: 1, duration: 0.34, ease: "power3.out" }, at + 0.09);
        tl.to(target, { scale: 0.95, duration: 0.09, ease: "power1.in" }, at);
        tl.to(target, { scale: 1, duration: 0.5, ease: "power3.out" }, at + 0.09);
      };

      /* Scene 1 (0–3.3s) — the checkbox opens the PIN field, and it is EMPTY. */
      tl.fromTo("#n4-form", { opacity: 0, x: -24 }, { opacity: 1, x: 0, duration: 0.6, ease: "power3.out" }, 0);
      tl.fromTo("#n4-rowcard", { opacity: 0, x: 24 }, { opacity: 1, x: 0, duration: 0.6, ease: "power3.out" }, 0.12);
      tl.to("#n4-cursor", { x: -1420, y: -640, duration: 0.82, ease: "power2.inOut" }, 1.0);
      press("#n4-box", 1.9);
      tl.to("#n4-tick", { opacity: 1, duration: 0.2, ease: "power2.out" }, 2.02);
      tl.to("#n4-box", { borderColor: "#2563eb", backgroundColor: "rgba(37,99,235,0.12)", duration: 0.3, ease: "power2.out" }, 2.02);
      tl.set("#n4-pinwrap", { marginTop: 24 }, 2.2);
      tl.to("#n4-pinwrap", { height: 124, duration: 0.5, ease: "power3.out" }, 2.2);

      /* Scene 2 (3.3–6.8s) — saved with the field untouched. Everything LOOKS fine. */
      tl.to("#n4-cursor", { x: -1130, y: -226, duration: 0.72, ease: "power2.inOut" }, 3.4);
      press("#n4-save", 4.3);
      tl.set("#n4-ripple", { x: 578, y: 800 }, 0);
      tl.fromTo("#n4-ripple", { scale: 0, opacity: 0.9 }, { scale: 3.6, opacity: 0, duration: 0.7, ease: "power2.out", immediateRender: false }, 4.34);
      tl.to("#n4-role", { backgroundColor: "rgba(21,128,61,0.12)", borderColor: "#22c55e", color: "#147b3b", duration: 0.4, ease: "power2.out" }, 4.9);
      tl.call(() => { document.getElementById("n4-role").textContent = "Administrador"; }, null, 4.9);
      tl.to("#n4-role", { scale: 1.14, duration: 0.24, ease: "power2.out" }, 4.9);
      tl.to("#n4-role", { scale: 1, duration: 0.42, ease: "power3.out" }, 5.14);

      /* Scene 3 (6.8–11.6s) — the warning. The frame dims and the empty field is named. */
      tl.to("#n4-cursor", { opacity: 0, duration: 0.26, ease: "power2.in" }, 6.8);
      tl.to("#n4-dim", { opacity: 1, duration: 0.5, ease: "power2.out" }, 6.84);
      tl.to("#n4-pinfield", { borderColor: "#dc2626", borderWidth: 3, duration: 0.4, ease: "power2.out" }, 7.1);
      tl.set("#n4-form", { zIndex: 18 }, 6.84);
      tl.set("#n4-link", { opacity: 1 }, 7.5);
      tl.to(link, { strokeDashoffset: 0, duration: 0.7, ease: "power2.inOut" }, 7.54);
      tl.fromTo("#n4-warn", { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.6, ease: "power3.out" }, 8.3);

      /* Scene 4 (11.6–14.9s) — the fix: a PIN of its own, typed as dots. */
      tl.to("#n4-cursor", { opacity: 1, duration: 0.24, ease: "power2.out" }, 11.62);
      tl.to("#n4-cursor", { x: -1120, y: -430, duration: 0.66, ease: "power2.inOut" }, 11.64);
      tl.to("#n4-pin-ph", { opacity: 0, duration: 0.2, ease: "power2.in" }, 12.34);
      tl.to("#n4-pin-val", { opacity: 1, duration: 0.01 }, 12.34);
      tl.to("#n4-pinfield", { borderColor: "#22c55e", duration: 0.34, ease: "power2.out" }, 12.34);
      const dotsEl = document.getElementById("n4-pin-dots");
      const DOTS = "••••••";
      const d = { t: 0 };
      tl.to(d, {
        t: 1, duration: 1.0, ease: "none",
        onUpdate: () => {
          const n = Math.min(DOTS.length, Math.floor(d.t * (DOTS.length + 0.4)));
          const next = DOTS.slice(0, n);
          if (dotsEl.textContent !== next) dotsEl.textContent = next;
        },
      }, 12.44);
      const b = { p: 0 };
      tl.to(b, {
        p: Math.PI * 2 * 4, duration: 2.2, ease: "none",
        onUpdate: () => { gsap.set("#n4-caret", { opacity: Math.sin(b.p) > 0 ? 1 : 0.15 }); },
      }, 12.34);
      tl.to(link, { strokeDashoffset: lLen, duration: 0.5, ease: "power2.inOut" }, 13.4);
      tl.to("#n4-warn", { scale: 0.88, opacity: 0, duration: 0.44, ease: "power2.in" }, 13.6);
      tl.fromTo("#n4-ok", { scale: 0.9, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.54, ease: "power3.out" }, 13.9);

      /* Scene 5 (14.9–17.4s) — held on the corrected state. This is the image that has to stay. */
      tl.to("#n4-cursor", { opacity: 0, duration: 0.3, ease: "power2.in" }, 14.92);

      window.__timelines["04-pin"] = tl;
    })();
